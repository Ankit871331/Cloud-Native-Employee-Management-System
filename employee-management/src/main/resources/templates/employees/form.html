<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Employee Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .card { border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0" th:text="${pageTitle}">Employee Form</h4>
                </div>
                <div class="card-body">

                    <div th:if="${errorMessage}" class="alert alert-danger"
                         th:text="${errorMessage}"></div>

                    <form th:action="${employee.id == null}
                            ? @{/employees/save}
                            : @{/employees/update/{id}(id=${employee.id})}"
                          th:object="${employee}" method="post">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name *</label>
                                <input type="text" th:field="*{firstName}" class="form-control"
                                       th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{firstName}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name *</label>
                                <input type="text" th:field="*{lastName}" class="form-control"
                                       th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{lastName}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Department *</label>
                                <input type="text" th:field="*{department}" class="form-control"
                                       th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{department}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Salary *</label>
                                <input type="number" step="0.01" th:field="*{salary}" class="form-control"
                                       th:classappend="${#fields.hasErrors('salary')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{salary}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" th:field="*{phone}" class="form-control"/>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary"
                                    th:text="${employee.id == null} ? 'Save Employee' : 'Update Employee'">
                                Save
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
