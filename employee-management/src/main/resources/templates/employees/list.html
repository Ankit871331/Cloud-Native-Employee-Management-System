<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .card { border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .table thead th { background: #212529; color: white; }
    </style>
</head>
<body>
<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">👥 Employee Management</h2>
        <a th:href="@{/employees/new}" class="btn btn-primary">+ Add Employee</a>
    </div>

    <!-- Success message -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Error message -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead>
                <tr>
                    <th>#</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Phone</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${employees.isEmpty()}">
                    <td colspan="8" class="text-center text-muted py-4">
                        No employees found. Click <b>Add Employee</b> to get started.
                    </td>
                </tr>
                <tr th:each="emp, iter : ${employees}">
                    <td th:text="${iter.count}"></td>
                    <td th:text="${emp.firstName}"></td>
                    <td th:text="${emp.lastName}"></td>
                    <td th:text="${emp.email}"></td>
                    <td th:text="${emp.department}"></td>
                    <td th:text="'₹ ' + ${#numbers.formatDecimal(emp.salary, 1, 2)}"></td>
                    <td th:text="${emp.phone}"></td>
                    <td class="text-center">
                        <a th:href="@{/employees/edit/{id}(id=${emp.id})}"
                           class="btn btn-sm btn-warning">Edit</a>
                        <a th:href="@{/employees/delete/{id}(id=${emp.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Delete this employee?');">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <p class="text-muted mt-3 mb-0">
        Total employees: <b th:text="${employees.size()}"></b>
    </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
